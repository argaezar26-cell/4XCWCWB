name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag (e.g. v2.0.0)'
        required: false
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_MANAGER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -name "sdkmanager" 2>/dev/null | head -n 1)
          if [ -n "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Generate debug keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --tests com.example.HardwareCalculatorsTest --no-daemon -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Prepare named APK file
        run: cp app/build/outputs/apk/debug/app-debug.apk Redmi4X-Hardware-Lab-v2.0.0.apk

      - name: Publish to GitHub Releases (direct APK download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="v2.0.0"
          fi

          NOTES="Major v2.0.0 Release — Persistent read-only Magisk root shell, Deep Sleep & CPU cluster time_in_state residency, JEDEC eMMC flash wear & Pre-EOL health, zRAM mm_stat compression ratio, thermal trip points & category filters, battery drain/charge %/h & internal resistance, Display/Kernel tunables audit, plus JSON export & Android Share sheet."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Redmi4X-Hardware-Lab-v2.0.0.apk --clobber
            gh release edit "$TAG" --title "Redmi 4X Hardware Lab $TAG" --notes "$NOTES" --latest
          else
            gh release create "$TAG" Redmi4X-Hardware-Lab-v2.0.0.apk \
              --target "${{ github.sha }}" \
              --title "Redmi 4X Hardware Lab $TAG" \
              --notes "$NOTES" \
              --latest
          fi

      - name: Upload Actions Artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: redmi-4x-hardware-lab-v2.0.0-apk
          path: Redmi4X-Hardware-Lab-v2.0.0.apk
